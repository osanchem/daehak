<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오산고등학교 교육과정 선택 프로그램</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --panel: #ffffff;
      --text: #202636;
      --muted: #697184;
      --line: #dfe4ee;
      --ok: #0f8a5f;
      --warn: #b7791f;
      --bad: #c92a2a;
      --brand: #2457c5;
      --shadow: 0 14px 30px rgba(32, 38, 54, .08);
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
      letter-spacing: 0;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .94);
      backdrop-filter: blur(12px);
    }

    .header-inner {
      max-width: 1320px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.25;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .school-logo {
      width: 48px;
      height: 48px;
      flex: 0 0 auto;
      border-radius: 6px;
      object-fit: contain;
      display: block;
    }

    .subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    select, button, .file-button {
      height: 38px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      color: var(--text);
      font: inherit;
    }

    select {
      padding: 0 34px 0 12px;
      min-width: 150px;
    }

    button, .file-button {
      padding: 0 12px;
      cursor: pointer;
      font-weight: 700;
    }

    .file-button {
      display: inline-flex;
      align-items: center;
    }

    .file-button input {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    button.primary {
      border-color: var(--brand);
      background: var(--brand);
      color: #fff;
    }

    .shell {
      max-width: 1320px;
      margin: 0 auto;
      padding: 16px 20px 28px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 16px;
      align-items: start;
    }

    .notice {
      margin-bottom: 14px;
      padding: 12px 14px;
      border: 1px solid #f0d58a;
      border-radius: var(--radius);
      background: #fff8df;
      color: #6f4e07;
      font-size: 13px;
      line-height: 1.5;
    }

    details {
      margin-bottom: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 50px;
      padding: 0 14px;
      cursor: pointer;
      font-weight: 800;
      list-style: none;
    }

    summary::-webkit-details-marker { display: none; }

    summary::after {
      content: "⌄";
      font-size: 20px;
      color: var(--muted);
      transform: rotate(0deg);
      transition: transform .18s ease;
    }

    details[open] summary::after { transform: rotate(180deg); }

    .grade-meta {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .section {
      padding: 0 14px 14px;
      border-top: 1px solid var(--line);
    }

    .group {
      padding-top: 12px;
    }

    .group-panel {
      margin-top: 12px;
      margin-bottom: 0;
      box-shadow: none;
    }

    .group-panel.group {
      padding-top: 0;
    }

    .group-panel summary {
      min-height: 50px;
      padding: 0 14px;
    }

    .group-panel .course-grid {
      padding: 0 14px 14px;
    }

    .group-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      align-items: end;
    }

    .group-title {
      margin: 0;
      font-size: 15px;
    }

    .group-rule {
      color: var(--muted);
      font-size: 12px;
      text-align: right;
      min-width: 64px;
    }

    .course-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 6px;
    }

    .course {
      display: grid;
      grid-template-columns: 22px 1fr;
      gap: 7px;
      min-height: 62px;
      padding: 8px 9px;
      border: 1px solid var(--line);
      border-left: 5px solid var(--area, #8a94a8);
      border-radius: var(--radius);
      background: #fff;
    }

    .course.required {
      background: #f3f5f9;
      color: #596273;
    }

    .course.limit-locked {
      opacity: .48;
    }

    .course input {
      width: 18px;
      height: 18px;
      margin: 2px 0 0;
      accent-color: var(--brand);
    }

    .course-name {
      font-weight: 800;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 5px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 0 6px;
      border-radius: 999px;
      background: #eef2f8;
      color: #4f5b70;
      font-size: 11px;
      font-weight: 700;
    }

    aside {
      position: sticky;
      top: 92px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .side-head {
      padding: 14px;
      border-bottom: 1px solid var(--line);
      background: #111827;
      color: #fff;
    }

    .total-number {
      margin-top: 6px;
      font-size: 30px;
      font-weight: 900;
      line-height: 1;
    }

    .side-body { padding: 12px 14px; }

    .priority-status {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
    }

    .priority-card {
      display: grid;
      grid-template-columns: 24px 1fr;
      gap: 8px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #f8fafc;
      font-size: 12px;
      line-height: 1.3;
    }

    .priority-card.ok {
      border-color: rgba(15, 138, 95, .32);
      background: #effaf5;
    }

    .priority-card.bad {
      border-color: rgba(201, 42, 42, .32);
      background: #fff1f1;
    }

    .priority-card .status {
      font-size: 16px;
      line-height: 1.1;
    }

    .priority-card strong {
      display: block;
      font-size: 13px;
    }

    .priority-card small {
      color: var(--muted);
    }

    .panel-title {
      margin: 0 0 8px;
      font-size: 13px;
      color: #394154;
    }

    .area-row {
      margin-bottom: 8px;
    }

    .area-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 5px;
      font-size: 12px;
      font-weight: 800;
    }

    .area-name {
      min-width: 0;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .area-score {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: repeat(2, max-content);
      gap: 4px;
      align-items: center;
      justify-content: end;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.2;
      text-align: right;
      white-space: nowrap;
    }

    .score-piece {
      padding: 2px 5px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #f8fafc;
    }

    .score-label {
      margin-right: 2px;
      color: var(--muted);
      font-weight: 800;
    }

    .score-value {
      color: var(--ok);
      font-weight: 950;
    }

    .score-note {
      display: block;
      margin-top: 1px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
    }

    .area-row.insufficient .score-value.actual {
      color: var(--bad);
    }

    .area-row.insufficient .score-piece.required {
      border-color: #f0b4b4;
      background: #fff5f5;
    }

    .bar {
      height: 6px;
      border-radius: 999px;
      background: #e9edf5;
      overflow: hidden;
    }

    .bar span {
      display: block;
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: var(--bar, var(--brand));
      transition: width .18s ease;
    }

    .status { font-weight: 900; }

    .empty {
      padding: 28px;
      color: var(--muted);
      text-align: center;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      background: #fff;
    }

    @media (max-width: 860px) {
      .header-inner {
        align-items: flex-start;
        flex-direction: column;
      }

      .controls { justify-content: flex-start; }

      .shell {
        display: block;
        padding: 16px 14px 190px;
      }

      aside {
        position: fixed;
        left: 10px;
        right: 10px;
        bottom: 10px;
        top: auto;
        z-index: 30;
        max-height: 170px;
        overflow: auto;
      }

      .side-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
      }

      .total-number { font-size: 26px; margin: 0; }
      .side-body { padding: 12px 14px; }
      .course-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

  <header>
    <div class="header-inner">

        <h2 class="panel-title">교과별 이수학점</h2>
        <div id="areaProgress"></div>
      </div>
    </aside>
  </main>

      return `${year}-${gradeKey}-${groupIndex}-${courseIndex}`;
    }

    function normalizeText(value) {
      return String(value ?? "").replace(/\s+/g, " ").trim();
    }

    function courseRestoreKey(course) {
      return `${normalizeText(course?.name).replace(/\s+/g, "").toLowerCase()}|${normalizeText(course?.sem).replace(/\s+/g, "").toLowerCase()}|${normalizeText(course?.area).replace(/\s+/g, "").toLowerCase()}`;
    }

    function courseNameRestoreKey(course) {
      return normalizeText(course?.name).replace(/\s+/g, "").toLowerCase();
    }

    function normalizeArea(value) {
      const text = normalizeText(value).replace(/\s*\/\s*/g, "/");
      if (!text) return "";
      const compact = text.replace(/\s+/g, "");
      if (compact.includes("제2외국어")) return "제2외국어/한문";
      if (compact.includes("기술")) return "기술∙가정/정보";
      if (compact.includes("사회")) return "사회";
      return AREA_ALIASES[text] || AREA_ALIASES[compact] || text;
    }

    function numberFrom(value) {
      const match = normalizeText(value).match(/\d+(?:\.\d+)?/);
      return match ? Number(match[0]) : 0;
    }

    function selectionRule(value) {
      const text = normalizeText(value);
      const match = text.match(/택\s*(\d+)/);
      return match ? `택${match[1]}` : "";

      return grades.length === 1 && semesters.length > 1 ? `${grades[0]}학년` : semesters[0].label;
    }

          return rows.some(row => row.some(cell => normalizeText(cell).includes("교육과정 학점 배당표")));

        if (section.includes("학교")) {
          const course = c(name, area, credits, semesterForRequired(row), type);
          SEMESTER_COLUMNS
            .filter(col => normalizeText(row[col.index]) && col.gradeKey)
            .forEach(col => {
              if (!required[col.gradeKey].some(item => item.name === course.name)) {
                required[col.gradeKey].push(course);
              }
            });
          activeGroup = null;
          return;
        }

        const startedBy = SEMESTER_COLUMNS.find(col => selectionRule(row[col.index]));
        if (startedBy) {
          activeGroup = {
            gradeKey: startedBy.gradeKey,
            title: groupTitleForSelection(startedBy, area),
            rule: selectionRule(row[startedBy.index]),
            semesterLabel: startedBy.label,
            items: []
          };
          parsed[startedBy.gradeKey].push(group(activeGroup.title, "elective", activeGroup.items, activeGroup.rule));
        }

        if (activeGroup) {
          activeGroup.items.push(c(name, area, credits, activeGroup.semesterLabel, type));
        }
      });

      ["grade1", "grade2", "grade3"].forEach(gradeKey => {
        if (required[gradeKey].length) {
          parsed[gradeKey].unshift(group("학교 지정 과목", "required", required[gradeKey]));
        }
      });

      if (!parsed.grade1.length && !parsed.grade2.length && !parsed.grade3.length) {
        throw new Error("과목 데이터를 읽지 못했습니다. 배당표의 열 구성이 바뀌었는지 확인해 주세요.");
      }

      return parsed;
    }

    function useImportedCourses(data, fileName) {
      const importedKey = "imported";
      courses[importedKey] = data;
      let option = yearSelect.querySelector(`option[value="${importedKey}"]`);
      if (!option) {
        option = document.createElement("option");
        option.value = importedKey;
        yearSelect.appendChild(option);
      }
      option.textContent = `불러온 엑셀: ${fileName.replace(/\.[^.]+$/, "")}`;
      yearSelect.value = importedKey;
      render();
    }

    function render() {
      const year = yearSelect.value;
      const data = courses[year];
      root.innerHTML = "";
      notice.hidden = !data.note;
      notice.textContent = data.note || "";

      ["grade1", "grade2", "grade3"].forEach((gradeKey, index) => {
        const details = document.createElement("details");
        details.open = true;

        const summary = document.createElement("summary");
        const gradeName = `${index + 1}학년 과목`;
        const count = data[gradeKey].reduce((sum, groupData) => sum + groupData.items.length, 0);
        summary.innerHTML = `<span>${gradeName}</span><span class="grade-meta">${count}개 과목</span>`;
        details.appendChild(summary);

        const section = document.createElement("div");
        section.className = "section";

        data[gradeKey].forEach((groupData, groupIndex) => {
          const isRequired = groupData.kind === "required";
          const groupEl = document.createElement(isRequired ? "details" : "div");
          groupEl.className = `group ${isRequired ? "group-panel" : ""}`;
          const choiceLimit = Number((groupData.rule.match(/택\s*(\d+)/) || [])[1] || 0);
          if (choiceLimit) groupEl.dataset.limit = choiceLimit;

          if (isRequired) {
            const summary = document.createElement("summary");
            summary.innerHTML = `
              <span class="group-title">${groupData.title}</span>
              <span class="group-rule">고정 이수</span>
            `;
            groupEl.appendChild(summary);
          } else {
            groupEl.innerHTML = `
              <div class="group-head">
                <h2 class="group-title">${groupData.title}</h2>
                <div class="group-rule" data-rule="${groupData.rule}">${groupData.rule}</div>
              </div>
            `;
          }

          const grid = document.createElement("div");
          grid.className = "course-grid";
          groupEl.appendChild(grid);

          groupData.items.forEach((course, courseIndex) => {
            const id = courseId(year, gradeKey, groupIndex, courseIndex);
            const label = document.createElement("label");
            label.className = `course ${isRequired ? "required" : ""}`;
            label.style.setProperty("--area", AREA_COLORS[course.area] || "#8a94a8");
            label.innerHTML = `
              <input type="checkbox" data-course='${JSON.stringify(course)}' ${isRequired ? "checked disabled" : ""} id="${id}">
              <span>
                <span class="course-name">${course.name}</span>
                <span class="chips">
                  <span class="chip">${course.area}</span>
                  <span class="chip">${course.credits}학점</span>
                  <span class="chip">${course.sem}</span>
                  <span class="chip">${course.type}</span>
                </span>
              </span>
            `;
            grid.appendChild(label);
          });

          section.appendChild(groupEl);
        });

        details.appendChild(section);
        root.appendChild(details);
      });

      root.querySelectorAll("input[type='checkbox']").forEach(input => {
        input.addEventListener("change", handleCourseChange);
      });
      update();
    }

    function selectedCourses() {
      return [...root.querySelectorAll("input[type='checkbox']:checked")]
        .map(input => JSON.parse(input.dataset.course));
    }

    function selectedElectiveCourses() {
      return [...root.querySelectorAll("input[type='checkbox']:checked")]
        .filter(input => !input.closest(".course")?.classList.contains("required"))
        .map(input => JSON.parse(input.dataset.course));
    }

    function sumsForCourses(selected) {
      const sums = {};
      let total = 0;
      selected.forEach(course => {
        sums[course.area] = (sums[course.area] || 0) + course.credits;
        total += course.credits;
      });
      return { sums, total };
    }

    function buildSelectionReport() {
      const selected = selectedCourses();
      const electives = selectedElectiveCourses();
      const { sums, total } = sumsForCourses(selected);
      const techLangCredits = upperTechLangCourses(selected).reduce((sum, course) => sum + course.credits, 0);
      const koreanMathEnglish = (sums["국어"] || 0) + (sums["수학"] || 0) + (sums["영어"] || 0);

      return {
        title: "오산고등학교 교육과정 선택 내역",
        generatedAt: new Date().toLocaleString("ko-KR"),
        admissionYear: yearSelect.value === "imported" ? "불러온 엑셀" : `${yearSelect.value}학년도 입학생`,
        note: notice.hidden ? "" : notice.textContent,
        totalCredits: total,
        requiredTotalCredits: 174,
        priorityRules: {
          koreanMathEnglishCredits: koreanMathEnglish,
          koreanMathEnglishLimit: 81,
          koreanMathEnglishOk: koreanMathEnglish <= 81,
          techLangCredits,
          techLangRequiredCredits: 12,
          techLangOk: techLangCredits >= 12
        },
        areaCredits: Object.fromEntries(Object.keys(REQUIRED).map(area => [
          area,
          {
            credits: sums[area] || 0,
            requiredCredits: REQUIRED[area],
            ok: (sums[area] || 0) >= REQUIRED[area]
          }
        ])),
        courses: electives.map(course => ({ ...course }))
      };
    }

    function safeFilePart(value) {
      return String(value || "")
        .replace(/[\\/:*?"<>|]/g, "")
        .replace(/\s+/g, "_")
        .slice(0, 40);
    }

    function downloadFile(filename, content, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function reportFileBase(report) {
      const date = new Date().toISOString().slice(0, 10).replace(/-/g, "");
      return `${safeFilePart(report.admissionYear)}_선택과목_${date}`;
    }

    function downloadSelectionJson() {
      const report = buildSelectionReport();
      downloadFile(
        `${reportFileBase(report)}.json`,
        JSON.stringify(report, null, 2),
        "application/json;charset=utf-8"
      );
    }

    function restoreYearFromReport(report) {
      const admissionYear = String(report?.admissionYear || "");
      const matchedOption = [...yearSelect.options].find(option => {
        return admissionYear.includes(option.value) || admissionYear === option.textContent;
      });
      if (matchedOption && yearSelect.value !== matchedOption.value) {
        yearSelect.value = matchedOption.value;
        render();
      }
    }

    function applyRestoredCourses(courses) {
      const list = Array.isArray(courses) ? courses : [];
      const keys = new Set(list.map(courseRestoreKey));
      const names = new Set(list.map(courseNameRestoreKey));
      let restored = 0;

      root.querySelectorAll("input[type='checkbox']").forEach(input => {
        if (input.closest(".course")?.classList.contains("required")) return;
        input.checked = false;
        input.disabled = false;
        input.closest(".course")?.classList.remove("limit-locked");
      });

      root.querySelectorAll("input[type='checkbox']").forEach(input => {
        if (input.closest(".course")?.classList.contains("required")) return;
        const course = JSON.parse(input.dataset.course);
        const checked = keys.has(courseRestoreKey(course)) || names.has(courseNameRestoreKey(course));
        input.checked = checked;
        if (checked) restored += 1;
      });
      update();
      return restored;
    }

    async function restoreSelectionJson(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      try {
        const report = JSON.parse(await file.text());
        if (!Array.isArray(report.courses)) throw new Error("courses 목록이 없습니다.");
        restoreYearFromReport(report);
        const restored = applyRestoredCourses(report.courses);
        notice.hidden = false;
        notice.textContent = `JSON 파일에서 선택 과목 ${restored}개를 복구했습니다.`;
      } catch (error) {
        notice.hidden = false;
        notice.textContent = `JSON 파일을 복구할 수 없습니다. ${error.message}`;
      } finally {
        event.target.value = "";
      }
    }

    function printSelectionPdf() {
      const report = buildSelectionReport();
      const areaRows = Object.entries(report.areaCredits).map(([area, data]) => `
        <tr>
          <td>${escapeHtml(area)}</td>
          <td>${data.credits}학점</td>
          <td>${data.requiredCredits}학점</td>
          <td>${data.ok ? "충족" : "미충족"}</td>
        </tr>
      `).join("");
      const courseRows = report.courses.map((course, index) => `
        <tr>
          <td>${index + 1}</td>
          <td>${escapeHtml(course.name)}</td>
          <td>${escapeHtml(course.area)}</td>
          <td>${course.credits}학점</td>
          <td>${escapeHtml(course.sem)}</td>
          <td>${escapeHtml(course.type)}</td>
        </tr>
      `).join("");
      const printWindow = window.open("", "_blank");
      if (!printWindow) {
        alert("팝업이 차단되어 PDF 저장 화면을 열지 못했습니다. 팝업 차단을 해제한 뒤 다시 시도해 주세요.");
        return;
      }

      printWindow.document.write(`
        <!doctype html>
        <html lang="ko">
        <head>
          <meta charset="utf-8">
          <title>${escapeHtml(report.title)}</title>
          <style>
            @page { size: A4; margin: 14mm; }
            * { box-sizing: border-box; }
            body { margin: 0; color: #202636; font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif; line-height: 1.45; }
            h1 { margin: 0 0 6px; font-size: 22px; }
            h2 { margin: 22px 0 8px; font-size: 15px; }
            .meta { color: #52616f; font-size: 12px; }
            .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
            .box { border: 1px solid #dfe4ee; border-radius: 6px; padding: 10px; }
            .label { color: #697184; font-size: 11px; font-weight: 700; }
            .value { margin-top: 4px; font-size: 18px; font-weight: 900; }
            table { width: 100%; border-collapse: collapse; font-size: 11px; page-break-inside: auto; }
            th, td { border: 1px solid #dfe4ee; padding: 6px 7px; text-align: left; vertical-align: top; }
            th { background: #f3f5f9; font-weight: 900; }
            tr { page-break-inside: avoid; page-break-after: auto; }
            .note { margin-top: 8px; color: #6f4e07; font-size: 11px; }
          </style>
        </head>
        <body>
          <h1>${escapeHtml(report.title)}</h1>
          <div class="meta">${escapeHtml(report.admissionYear)} · 생성일 ${escapeHtml(report.generatedAt)}</div>
          ${report.note ? `<div class="note">${escapeHtml(report.note)}</div>` : ""}
          <section class="summary">
            <div class="box"><div class="label">총 교과 이수학점</div><div class="value">${report.totalCredits} / ${report.requiredTotalCredits}</div></div>
            <div class="box"><div class="label">국어+수학+영어</div><div class="value">${report.priorityRules.koreanMathEnglishCredits} / ${report.priorityRules.koreanMathEnglishLimit}</div></div>
            <div class="box"><div class="label">기술·가정/정보 + 제2외국어/한문</div><div class="value">${report.priorityRules.techLangCredits} / ${report.priorityRules.techLangRequiredCredits}</div></div>
          </section>
          <h2>교과별 이수학점</h2>
          <table>
            <thead><tr><th>교과</th><th>이수</th><th>필수</th><th>상태</th></tr></thead>
            <tbody>${areaRows}</tbody>
          </table>
          <h2>선택 과목 목록</h2>
          <table>
            <thead><tr><th>No.</th><th>과목명</th><th>교과</th><th>학점</th><th>학기</th><th>유형</th></tr></thead>
            <tbody>${courseRows}</tbody>
          </table>
          <script>
            window.addEventListener("load", () => {
              document.title = ${JSON.stringify(reportFileBase(report))};
              setTimeout(() => window.print(), 150);
            });
          <\/script>
        </body>
        </html>
      `);
      printWindow.document.close();
    }

    function update() {
      const selected = selectedCourses();
      const { sums, total } = sumsForCourses(selected);

      totalCredits.textContent = total;
      updateGroupLimits();
      renderAreas(sums, selected);
      renderPriorityRules(sums);
    }

    function groupLimit(groupEl) {
      return Number(groupEl.dataset.limit || 0);
    }

    function groupInputs(groupEl) {
      return [...groupEl.querySelectorAll("input[type='checkbox']")];
    }

    function updateGroupLimits() {
      root.querySelectorAll(".group[data-limit]").forEach(groupEl => {
        const limit = groupLimit(groupEl);
        const inputs = groupInputs(groupEl);
        const checkedCount = inputs.filter(input => input.checked).length;
        const isFull = checkedCount >= limit;
        const ruleEl = groupEl.querySelector(".group-rule");

        if (ruleEl) {
          ruleEl.textContent = `${checkedCount}/${limit} 선택`;
        }

        inputs.forEach(input => {
          const locked = isFull && !input.checked;
          input.disabled = locked;
          input.closest(".course")?.classList.toggle("limit-locked", locked);
        });
      });
    }

    function handleCourseChange(event) {
      const input = event.target;
      const groupEl = input.closest(".group[data-limit]");
      if (input.checked && groupEl) {
        const limit = groupLimit(groupEl);
        const checked = groupInputs(groupEl).filter(item => item.checked);
        if (limit && checked.length > limit) {
          input.checked = false;
        }
      }
      update();
    }

    function upperTechLangCourses(selected) {
      return selected.filter(course => {
        const upper = course.area === "기술∙가정/정보" || course.area === "제2외국어/한문";
        return upper;
      });
    }

    function creditScoreHtml(value, target, requiredNote = "") {
      const noteLabel = requiredNote ? ` (${requiredNote})` : "";
      const noteHtml = requiredNote ? `<span class="score-note">${requiredNote}</span>` : "";
      return `
        <span class="area-score" aria-label="실제 이수학점 ${value}학점, 필수이수학점 ${target}학점${noteLabel}">
          <span class="score-piece actual"><span class="score-label">이수</span><span class="score-value actual">${value}학점</span></span>
          <span class="score-piece required"><span class="score-label">필수</span><span class="score-value required">${target}학점</span>${noteHtml}</span>
        </span>
      `;
    }

    function renderAreas(sums, selected) {
      areaProgress.innerHTML = "";
      Object.entries(REQUIRED).forEach(([area, target]) => {
        const value = sums[area] || 0;
        const pct = Math.min(100, Math.round(value / target * 100));
        const ok = value >= target;
        const row = document.createElement("div");
        row.className = `area-row ${ok ? "sufficient" : "insufficient"}`;
        row.innerHTML = `
          <div class="area-top">
            <span class="area-name">${area}</span>
            ${creditScoreHtml(value, target)}
          </div>
          <div class="bar" style="--bar:${AREA_COLORS[area]}"><span style="width:${pct}%"></span></div>
        `;
        areaProgress.appendChild(row);
      });

      const techLangCourses = upperTechLangCourses(selected);
      const techLangCredits = techLangCourses.reduce((sum, course) => sum + course.credits, 0);
      const techLangTarget = 12;
      const techLangOk = techLangCredits >= techLangTarget;
      const techLangRow = document.createElement("div");
      techLangRow.className = `area-row ${techLangOk ? "sufficient" : "insufficient"}`;
      techLangRow.innerHTML = `
        <div class="area-top">
          <span class="area-name">기술·가정/정보 + 제2외국어/한문</span>
          ${creditScoreHtml(techLangCredits, techLangTarget, "교양 제외")}
        </div>
        <div class="bar" style="--bar:#6b7280"><span style="width:${Math.min(100, Math.round(techLangCredits / techLangTarget * 100))}%"></span></div>
      `;
      areaProgress.appendChild(techLangRow);
    }

    function renderPriorityRules(sums) {
      const koreanMathEnglish = (sums["국어"] || 0) + (sums["수학"] || 0) + (sums["영어"] || 0);

      const priorityRules = [
        {
          title: "국어+수학+영어 합계",
          detail: `${koreanMathEnglish}/81학점 이하`,
          state: koreanMathEnglish <= 81 ? "ok" : "bad"
        }
      ];

      priorityStatus.innerHTML = "";
      priorityRules.forEach(rule => {
        const el = document.createElement("div");
        el.className = `priority-card ${rule.state}`;
        const mark = rule.state === "ok" ? "✓" : "×";
        el.innerHTML = `
          <span class="status">${mark}</span>
          <span><strong>${rule.title}</strong><small>${rule.detail}</small></span>
        `;
        priorityStatus.appendChild(el);
      });
    }

    document.getElementById("clearElectives").addEventListener("click", () => {
      root.querySelectorAll("input[type='checkbox']:not(:disabled)").forEach(input => {
        input.checked = false;
      });
      update();
    });

    document.getElementById("downloadJson").addEventListener("click", downloadSelectionJson);
    document.getElementById("downloadPdf").addEventListener("click", printSelectionPdf);
    jsonInput.addEventListener("change", restoreSelectionJson);

    excelInput.addEventListener("change", async event => {
      const file = event.target.files?.[0];
      if (!file) return;

      try {
        if (!window.XLSX) {
          throw new Error("엑셀 읽기 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.");
        }
        const buffer = await file.arrayBuffer();
        const workbook = XLSX.read(buffer, { type: "array" });
        useImportedCourses(parseCurriculumWorkbook(workbook, file.name), file.name);
      } catch (error) {
        notice.hidden = false;
        notice.textContent = `엑셀 파일을 읽지 못했습니다. ${error.message}`;
      } finally {
        event.target.value = "";
      }
    });

    yearSelect.addEventListener("change", render);
    render();
  </script>
</body>
</html>
